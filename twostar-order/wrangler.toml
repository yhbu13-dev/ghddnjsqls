# 투스타 발주 — Cloudflare Workers 설정
# 배포: Windows 에서 deploy-cloudflare.bat 더블클릭 (= node scripts/deploy-cloudflare.js)
name = "twostar-order"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]   # node:crypto · Buffer 사용

# 회사 주소 (카카오는 workers.dev 주소를 링크로 열어 주지 않아 자체 도메인 사용)
routes = [
  { pattern = "order.twostarorder.com", custom_domain = true },
]

[assets]
directory = "./public"          # 발주서·관리자 화면 파일
binding = "ASSETS"
run_worker_first = true         # 모든 요청을 코드가 먼저 받아 보안 헤더를 붙인다
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "twostar-order"
database_id = "REPLACE_WITH_D1_ID"   # deploy-cloudflare 가 자동으로 채움

[vars]
PUBLIC_URL = "https://order.twostarorder.com"   # 발주서 링크·스킬 URL 을 항상 이 주소로 만든다
BLOCK_ID = "6ab764d9f6804a5978559653"   # 오픈빌더 "발주" 블록 ID
MIN_ORDER = "0"
SEED_SAMPLE = "0"                        # 1 = 품목이 하나도 없을 때 샘플 69개·매장 3곳을 넣음 (데모용). 운영 중에는 0

[observability]
enabled = true                           # Cloudflare 대시보드에서 카톡 요청 기록(로그) 보기
