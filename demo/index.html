  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
const hideTip = () => { tip().style.display = 'none'; };
function svgPoint(svg, ev) { const r = svg.getBoundingClientRect(); const vb = svg.viewBox.baseVal; return { x: (ev.clientX - r.left) / r.width * vb.width, y: (ev.clientY - r.top) / r.height * vb.height }; }
function bindCharts() {
  const inv = $('#invChart');
  if (inv && CHART) {
    const hit = $('#hit', inv), cx = $('#cx', inv), cxd = $('#cxd', inv);
    const move = (ev) => {
      const p = svgPoint(inv, ev), c = CHART;
      const tt = c.t0 + (p.x - c.ml) / (c.W - c.ml - c.mr) * (c.t1 - c.t0);
      let best = c.pts[0]; c.pts.forEach((q) => { if (Math.abs(q.t - tt) < Math.abs(best.t - tt)) best = q; });
      const xx = c.x(best.t);
      cx.setAttribute('x1', xx); cx.setAttribute('x2', xx); cx.setAttribute('visibility', 'visible');
      cxd.setAttribute('cx', xx); cxd.setAttribute('cy', c.y(best.E)); cxd.setAttribute('visibility', 'visible');
      const near = c.marks.filter((m) => Math.abs(m.t - best.t) < 3).map((m) => `<div class="tr" style="line-height:1.45;margin-top:4px"><span style="color:var(--ink)">${esc(m.text)}</span></div>`).join('');
      showTip(`<div class="tt">${esc(when(best.t))}${best.f ? ' · 예측' : ''}</div>
        <div class="tr"><i class="k"></i><b>${box(best.E)}박스</b><span>추정 재고</span></div>
        <div class="tr"><i class="k band"></i><b>±${num(best.w, 2)}</b><span>하한 ${box(best.E - best.w)} · 상한 ${box(best.E + best.w)}</span></div>
        <div class="tr"><i class="k dash"></i><b>${box(c.S)}</b><span>안전재고</span></div>${near}`, ev);
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => { hideTip(); cx.setAttribute('visibility', 'hidden'); cxd.setAttribute('visibility', 'hidden'); });
  }
  const rm = $('#routeMap');
  if (rm) {
    rm.addEventListener('pointermove', (ev) => {
      const p = svgPoint(rm, ev);
      let best = null, bd = 1e9; CHART_ROUTE.forEach((n) => { const d = Math.hypot(n.x - p.x, n.y - p.y); if (d < bd) { bd = d; best = n; } });
      if (best && bd < Math.max(12, best.r + 6)) showTip(best.html, ev); else hideTip();
    });
    rm.addEventListener('pointerleave', hideTip);
  }
  const hc = $('#histChart');
  if (hc) {
    const hit = $('#histHit', hc);
    const bars = $$('.hbar', hc);
    hc.addEventListener('pointermove', (ev) => {
      const p = svgPoint(hc, ev);
      const b = CHART_BARS.findIndex((x) => p.x >= x.x && p.x < x.x + x.w);
      bars.forEach((el) => el.style.opacity = '');
      if (b >= 0 && p.y > 10) { showTip(CHART_BARS[b].html, ev); const el = bars.find((e) => +e.dataset.i === b); if (el) el.style.opacity = '.75'; } else hideTip();
    });
    hc.addEventListener('pointerleave', () => { hideTip(); bars.forEach((el) => el.style.opacity = ''); });
    hit.style.pointerEvents = 'none';
  }
  $$('.mhit').forEach((h) => {
    const id = h.dataset.mini, c = CHART_MINI[id], svg = $('#mini-' + id), line = $('#mcx-' + id);
    h.addEventListener('pointermove', (ev) => {
      const p = svgPoint(svg, ev);
      const i = Math.max(0, Math.min(c.vals.length - 1, Math.round((p.x - c.ml) / (c.W - c.ml - c.mr) * (c.vals.length - 1))));
      line.setAttribute('x1', c.x(i)); line.setAttribute('x2', c.x(i)); line.setAttribute('visibility', 'visible');
      const w = pilotMetricsCache.weeks[i];
      showTip(`<div class="tt">W${i + 1} · ${md(WEEK_START(i))}–${md(WEEK_START(i) + 6 * 24)}${i === 5 ? ' (진행 중)' : ''}</div><div class="tr"><i class="k"></i><b>${num(c.vals[i], 1)}${c.opt.unit}</b><span>${c.opt.label}</span></div><div class="tr"><i class="k dash"></i><b>${num(c.opt.target, 0)}${c.opt.unit}</b><span>목표</span></div><div class="tr"><span>표본 ${id === 'err' ? '실사 ' + num(DB.counts.filter((x) => x.week === i).length) + '건' : id === 'appr' ? '응답 ' + w.n + '건' : '정차 ' + w.ns + '회'}</span></div>`, ev);
    });
    h.addEventListener('pointerleave', () => { hideTip(); line.setAttribute('visibility', 'hidden'); });
  });
}
let pilotMetricsCache = null;

/* ==========================================================================
   [액션] 승인 시뮬레이트 · 보류 · 리마인드 · 재결제 · 선제 제안 · 즉시 발송
   ========================================================================== */
function toast(msg, ic = 'check') {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = icon(ic, 16) + '<span>' + msg + '</span>';
  $('#toasts').appendChild(el); setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3600); setTimeout(() => el.remove(), 4000);
}
function moveCard(id, fn) {
  const el = $(`.ocard[data-order="${id}"]`);
  if (el && state.tab === 'orders') { el.classList.add('leave'); setTimeout(() => { fn(); DB.justMoved = id; render(); }, 280); }
  else { fn(); render(); }
}
// [승인 시뮬레이트] — 사장님이 알림톡 [승인] 버튼을 누른 상황을 재현
function approve(id, qty) {
  const p = DB.byId[id]; if (!p) return;
  const t = nowH();
  // TODO: 알림톡 API 연동 — 실서비스에서는 카카오 버튼 콜백 webhook(POST /v1/alimtalk/callback)이 이 처리를 트리거
  // TODO: PG 결제 API 연동 — 등록 카드 빌링키로 자동결제 승인 요청
  moveCard(id, () => {
    if (qty != null && qty !== p.lines[0].qty) { p.lines[0].qtyOrig = p.lines[0].qty; p.lines[0].qty = qty; p.modify = true; p.amount = p.lines.reduce((a, l) => a + l.qty * SKU[l.sku].price, 0); }
    if (p.openAt == null) p.openAt = t - .5 / 60;
    p.response = 'approve'; p.respondAt = t; p.closeAt = null;
    p.paidAt = t; p.payFail = false; p.payFailAt = null;
    p.deliverDay = dayOf(t) + (hodOf(t) < CUTOFF_H ? 0 : 1);
    p.live = true;
    state.noti.qty = false;
  });
  const st = S(p.store);
  toast(`<b>${esc(st.name)}</b> 발주 승인 · 결제 완료 ${won(p.amount)}<br><span style="opacity:.75">${hodOf(t) < CUTOFF_H ? '오늘 13:30 출고' : '컷오프 이후 승인 → 내일 13:30 출고 · 오후 도착'}</span>`);
}
function hold(id) {
  const p = DB.byId[id]; if (!p) return; const t = nowH();
  moveCard(id, () => { if (p.openAt == null) p.openAt = t - .5 / 60; p.response = 'hold'; p.respondAt = t; p.closeAt = t; p.live = true; state.noti.qty = false; });
  toast(`<b>${esc(S(p.store).name)}</b> 보류 처리 · 내일 10시 재확인`, 'clock');
}
function remind(id) {
  const p = DB.byId[id]; if (!p) return; const t = nowH();
  // TODO: 알림톡 API 연동 — 리마인드 템플릿(BF_REMIND_01) 발송
  p.remindedAt = t;
  DB.manualEv.push({ t, kind: '알림톡', tone: 'b-line', region: S(p.store).region, html: `<b>${esc(S(p.store).name)}</b> · 리마인드 발송 (운영자)` });
  render(); toast(`<b>${esc(S(p.store).name)}</b>에 리마인드 알림톡을 보냈습니다`, 'send');
}
function repay(id, btn) {
  const p = DB.byId[id]; if (!p) return;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>요청 중…'; }
  // TODO: PG 결제 API 연동 — 재결제 링크 발송 및 결제 결과 수신
  setTimeout(() => {
    const t = nowH();
    moveCard(id, () => { p.paidAt = t; p.repayAt = t; p.deliverDay = dayOf(t) + (hodOf(t) < CUTOFF_H ? 0 : 1); });
    DB.manualEv.push({ t, kind: '결제 완료', tone: 'b-ok', region: S(p.store).region, html: `<b>${esc(S(p.store).name)}</b> · 재결제 완료 ${won(p.amount)}` });
    toast(`<b>${esc(S(p.store).name)}</b> 재결제 완료 · ${won(p.amount)}`, 'card');
  }, 1300);
}
function proposeNow(storeIdx) {
  const st = S(storeIdx), t = nowH();
  const trig = st.items.slice().sort((a, b) => hoursToTrigger(st, a) - hoursToTrigger(st, b))[0];
  const lines = [];
  st.items.forEach((it) => {
    const rate = itemRate(st, it), dtt = (it.E - it.w - it.S) / rate;
    const q = Math.max(1, Math.ceil(it.S + .08 + rate * COVER_DAYS - it.E - .2));
    if (it === trig || dtt < 8) lines.push({ sku: it.sku.id, qty: q, E: it.E, w: it.w, S: it.S, trig: it === trig });
  });
  lines.sort((a, b) => (b.trig - a.trig) || (b.qty * SKU[b.sku].price - a.qty * SKU[a.sku].price));
  const p = { id: 'PO-' + String(++DB.seq).padStart(4, '0'), store: storeIdx, createdAt: t, sendAt: null, sendRule: 'manual', manual: true, lines, week: 5, response: null, respondAt: null, openAt: null, closeAt: null, paidAt: null, deliverDay: null, live: true };
  p.amount = lines.reduce((a, l) => a + l.qty * SKU[l.sku].price, 0);
  DB.P.push(p); DB.byId[p.id] = p;
  render();
  toast(`<b>${esc(st.name)}</b> 선제 제안 생성 · 발주 관제 [제안 생성]에서 검수 후 발송`, 'send');
}
function sendNow(id) {
  const p = DB.byId[id]; if (!p) return; const t = nowH();
  // TODO: 알림톡 API 연동 — 발주 제안 템플릿(BF_PROPOSE_03) 즉시 발송
  moveCard(id, () => { p.sendAt = t; p.sendRule = 'manual'; });
  toast(`<b>${esc(S(p.store).name)}</b>에 발주 제안 알림톡을 발송했습니다`, 'send');
}
function cancelP(id) { const p = DB.byId[id]; if (!p) return; p.cancelled = true; state.ord.sel = null; render(); toast('제안을 취소했습니다', 'x'); }

/* ==========================================================================
   [이벤트 바인딩]
   ========================================================================== */
function go(tab) { state.tab = tab; state.inv.open = false; hideTip(); render(); $('#main').scrollTop = 0; }
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('button, [data-order], [data-go], [data-pick-sku], [data-noti], [data-settle], [data-close-modal], [data-close-drawer]');
  if (!el) { if (state.inv.open && !ev.target.closest('.combo')) { state.inv.open = false; render(); } return; }
  const d = el.dataset;
  if (d.tab) return go(d.tab);
  if (d.region) { state.region = d.region; return render(); }
  if (el.id === 'btnReset') return resetDemo();
  if (d.act) {
    ev.stopPropagation();
    const a = d.act;
    if (a === 'approve') return approve(d.id);
    if (a === 'approveqty') return approve(d.id, +d.qty);
    if (a === 'qtyedit') { state.noti.qty = d.id; return render(); }
    if (a === 'qtycancel') { state.noti.qty = false; return render(); }
    if (a === 'hold') return hold(d.id);
    if (a === 'remind') return remind(d.id);
    if (a === 'repay') return repay(d.id, el);
    if (a === 'propose') return proposeNow(+d.store);
    if (a === 'sendnow') return sendNow(d.id);
    if (a === 'cancel') return cancelP(d.id);
    if (a === 'call') return toast(`${esc(S(+d.store).name)} 사장님께 전화 연결 요청 (운영팀 CTI · 데모)`, 'phone');
  }
  if (d.filterKind) { ev.stopPropagation(); state.actFilter = state.actFilter === d.filterKind ? 'ALL' : d.filterKind; return render(); }
  if (d.actFilter) { state.actFilter = d.actFilter; return render(); }
  if (d.go) {
    const [kind, a, b] = d.go.split(':');
    if (kind === 'order') { state.tab = 'orders'; state.ord.sel = a; return render(); }
    if (kind === 'inv') { state.tab = 'inventory'; state.inv.store = +a; if (b) state.inv.sku = b; state.inv.status = 'ALL'; return render(); }
  }
  if (el.id === 'storeBtn') { state.inv.open = !state.inv.open; state.inv.q = ''; render(); const q = $('#storeQ'); if (q) q.focus(); return; }
  if (d.pickStore) { state.inv.store = +d.pickStore; state.inv.open = false; state.inv.status = 'ALL'; const st = S(state.inv.store); if (!st.items.some((x) => x.sku.id === state.inv.sku)) state.inv.sku = st.items[0].sku.id; return render(); }
  if (d.badgeSku) { ev.stopPropagation(); state.inv.sku = d.badgeSku; return render(); }
  if (d.pickSku) { state.inv.sku = d.pickSku; return render(); }
  if (d.invStatus) { state.inv.status = d.invStatus; return render(); }
  if (d.order) { state.ord.sel = state.ord.sel === d.order ? null : d.order; return render(); }
  if (d.closeDrawer != null) { state.ord.sel = null; return render(); }
  if (d.notiFilter) { ev.stopPropagation(); state.noti.filter = state.noti.filter === d.notiFilter && el.classList.contains('badge') ? 'ALL' : d.notiFilter; state.noti.sel = null; return render(); }
  if (d.notiDay) { state.noti.day = +d.notiDay; state.noti.filter = 'ALL'; state.noti.sel = null; return render(); }
  if (d.noti) { state.noti.sel = d.noti; state.noti.qty = false; return render(); }
  if (d.delScope) { state.del.scope = d.delScope; return render(); }
  if (d.perf) { state.rep.perf = d.perf; return render(); }
  if (d.settle != null) { state.modal = +d.settle; return render(); }
  if (d.closeModal != null && (ev.target === el || el.classList.contains('xbtn'))) { state.modal = null; return render(); }
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'skuSel') { state.inv.sku = ev.target.value; render(); } });
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'storeQ') {
    state.inv.q = ev.target.value; const pos = ev.target.selectionStart; render();
    const q = $('#storeQ'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { if (state.modal != null) state.modal = null; else if (state.inv.open) state.inv.open = false; else state.ord.sel = null; return render(); }
  if (ev.target.matches('input, select, textarea')) return;
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.order) { ev.target.click(); return; }
  const n = +ev.key; if (n >= 1 && n <= 6 && !ev.metaKey && !ev.ctrlKey && !ev.altKey) go(TABS[n - 1].id);
});

/* ==========================================================================
   [실시간 틱] 시계 · 경과 시간 · 배송 진행 · POS 로그 카운터
   ========================================================================== */
function tick() {
  const t = nowH(), last = DB.lastTick;
  DB.posAgo = 1 + Math.floor(Math.random() * 4);
  if (Math.random() < .35) DB.posToday += 1 + Math.floor(Math.random() * 3);
  tickClock();
  // 경과 시간 텍스트 갱신
  $$('[data-since]').forEach((el) => { el.textContent = durTxt((t - parseFloat(el.dataset.since)) * 60); });
  // 상태 전이(도착·하차 완료·예약 발송·30분 초과)가 있으면 다시 그림
  let changed = false;
  DB.stops.forEach((s) => {
    if (s.arrive > last && s.arrive <= t) { changed = true; }
    if (s.depart > last && s.depart <= t) { changed = true; toast(`<b>${esc(S(s.store).name)}</b> 배송 완료 · 하차 ${s.boxes}박스 · 정차 ${num(s.dur, 1)}분`, 'truck'); }
  });
  DB.P.forEach((p) => {
    if (p.sendAt != null && p.sendAt > last && p.sendAt <= t) changed = true;
    if (p.sendAt != null && p.sendAt + .5 > last && p.sendAt + .5 <= t && !p.response) changed = true;
  });
  DB.lastTick = t;
  if (changed && !state.inv.open) render();
}

/* ==========================================================================
   [부팅 · 리셋]
   ========================================================================== */
function boot(msg) {
  const b = $('#boot'); b.classList.remove('hide'); $('#bootMsg').textContent = msg;
  setTimeout(() => {
    DB = loadData();
    bootReal = Date.now();
    Object.keys(prevKpi).forEach((k) => delete prevKpi[k]);
    initState();
    pilotMetricsCache = pilotMetrics();
    render();
    setTimeout(() => b.classList.add('hide'), 250);
  }, 60);
}
function resetDemo() {
  const tab = state ? state.tab : 'overview';
  state = null;
  boot('데모 데이터 초기화 중…');
  setTimeout(() => { state.tab = tab; render(); toast('데모 데이터를 초기화했습니다 · 시나리오 시각 ' + hm(SCENARIO_NOW_H)); }, 400);
}
boot('티오더 POS 판매 로그 동기화 중…');
setInterval(() => { if (DB) tick(); }, 1000);
</script>
